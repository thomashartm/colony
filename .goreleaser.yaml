# schema = 1 (colony tooling configuration)
version: 2
project_name: colony
builds:
  - main: ./cmd/colony
    binary: colony
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - colony-logo.png
      - config.example.toml
checksum:
  name_template: checksums.txt
snapshot:
  version_template: "0.1.0-dev-{{ .ShortCommit }}"
changelog:
  disable: true
