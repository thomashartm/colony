# schema = 1 (motley tooling configuration)
version: 2
project_name: motley
builds:
  - id: motley
    main: ./cmd/motley
    binary: motley
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: mtly
    main: ./cmd/motley
    binary: mtly
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - motley-logo.png
      - config.example.toml
      - examples/blueprints/*.md
checksum:
  name_template: checksums.txt
snapshot:
  version_template: "0.7.0-dev-{{ .ShortCommit }}"
changelog:
  disable: true
